name: Agente de Instagram

on:
  schedule:
    # Manhã (~8h de Brasília = 11h UTC): tenta às 8h07 e, como rede, de novo às 8h23.
    - cron: "7 11 * * *"
    - cron: "23 11 * * *"
    # Tarde (~14h de Brasília = 17h UTC): tenta às 14h07 e, como rede, de novo às 14h23.
    - cron: "7 17 * * *"
    - cron: "23 17 * * *"

  # Permite disparar manualmente pela aba "Actions" do GitHub.
  workflow_dispatch:
    inputs:
      turno:
        description: "Turno do post"
        required: true
        default: "auto"
        type: choice
        options: [auto, manha, tarde]
      mock:
        description: "Gerar exemplo sem chamar a API"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: agente-instagram

jobs:
  gerar-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências e a fonte da marca
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          pip install pillow

      - name: Gerar o post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.turno }}" != "auto" ] && [ -n "${{ inputs.turno }}" ]; then
            ARGS="$ARGS --turno=${{ inputs.turno }}"
          fi
          if [ "${{ inputs.mock }}" = "true" ]; then
            ARGS="$ARGS --mock"
          fi
          python3 agente-instagram.py $ARGS

      - name: Publicar no painel
        if: always()
        continue-on-error: true
        run: |
          echo "--- Conteúdo de docs/ antes de publicar ---"
          ls -la docs docs/posts || true
          echo "-------------------------------------------"
          git config user.name "Agente de Instagram"
          git config user.email "actions@github.com"
          # desliga rebase automático neste repositório (era o que atropelava a publicação)
          git config pull.rebase false
          git config rebase.autoStash false

          # guarda os arquivos que ESTA rodada gerou
          mkdir -p /tmp/novo
          cp -r docs/. /tmp/novo/

          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            # parte sempre da versão mais recente do repositório, sem mesclar
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd docs

            # recoloca por cima o que esta rodada gerou (nossa versão vence)
            cp -rf /tmp/novo/. docs/

            git add docs
            if git diff --staged --quiet; then
              echo "Nada novo para publicar."
              exit 0
            fi
            git commit -m "Post de $(date '+%d/%m/%Y %H:%M')"

            if git push origin "HEAD:$BRANCH"; then
              echo "Publicado no painel."
              exit 0
            fi
            echo "Remoto avançou. Tentativa $i — repetindo do zero..."
            sleep 3
          done
          echo "Nao foi possivel publicar no painel nesta rodada (o post já está salvo no repositório)."
