name: Agente de Instagram

on:
  schedule:
    # Manhã (~8h de Brasília = 11h UTC): tenta às 8h07 e, como rede, de novo às 8h23.
    - cron: "7 11 * * *"
    - cron: "23 11 * * *"
    # Tarde (~14h de Brasília = 17h UTC): tenta às 14h07 e, como rede, de novo às 14h23.
    - cron: "7 17 * * *"
    - cron: "23 17 * * *"

  # Permite disparar manualmente pela aba "Actions" do GitHub.
  workflow_dispatch:
    inputs:
      turno:
        description: "Turno do post"
        required: true
        default: "auto"
        type: choice
        options: [auto, manha, tarde]
      mock:
        description: "Gerar exemplo sem chamar a API"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: agente-instagram

jobs:
  gerar-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências e a fonte da marca
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          pip install pillow

      - name: Gerar o post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.turno }}" != "auto" ] && [ -n "${{ inputs.turno }}" ]; then
            ARGS="$ARGS --turno=${{ inputs.turno }}"
          fi
          if [ "${{ inputs.mock }}" = "true" ]; then
            ARGS="$ARGS --mock"
          fi
          python3 agente-instagram.py $ARGS

      - name: Publicar no painel
        if: always()
        continue-on-error: true
        run: |
          echo "--- Conteúdo de docs/ antes de publicar ---"
          ls -la docs docs/posts || true
          echo "-------------------------------------------"
          git config user.name "Agente de Instagram"
          git config user.email "actions@github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Nada novo para publicar (o post desta rodada já existia)."
            exit 0
          fi
          git commit -m "Post de $(date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }}
            # Junta o que houver de novo no remoto; em conflito nos arquivos que
            # regeneramos (index.html, posts.json, imagem), a NOSSA versão vence.
            git merge -X ours --no-edit origin/${{ github.ref_name }} || git merge --abort
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Publicado no painel."
              exit 0
            fi
            echo "Remoto avançou de novo. Tentativa $i — reconciliando..."
            sleep 3
          done
          echo "Nao foi possivel publicar no painel nesta rodada (o post já está salvo no repositório)."
